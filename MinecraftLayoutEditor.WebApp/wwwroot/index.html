<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MinecraftLayoutEditor.WebApp</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="styles.css"/>
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <!-- Startup is explicit (autostart="false" plus the Blazor.start below) so the
         runtime is only ever started once. -->
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js" autostart="false"></script>
    <script>
        window.init = (instance) => {
            var canvasContainer = document.getElementById('canvasContainer');
            var canvases = canvasContainer.getElementsByTagName('canvas') || [];

            window.canvas = canvases.length ? canvases[0] : null;

            if (window.canvas) {
                window.canvas.onmousemove = (e) => {
                    instance.invokeMethodAsync('JSOnMouseMove', e.offsetX, e.offsetY);
                };

                window.canvas.onwheel = (e) => {
                    e.preventDefault();
                    instance.invokeMethodAsync('JSOnWheel', e.deltaY, e.offsetX, e.offsetY);
                };
            }
        };

        Blazor.start();

        window.getElementClientSize = (element) => {
            return {
                Width: element.clientWidth,
                Height: element.clientHeight
            };
        };

        // Render stats are polled from outside Blazor's render loop, so reading them
        // never schedules a component re-render and cannot perturb what it measures.
        window.initRenderStats = (dotnetHelper) => {
            const overlay = document.createElement('pre');
            overlay.id = 'renderStats';
            document.body.appendChild(overlay);

            window.readRenderProfile = () => dotnetHelper.invokeMethodAsync('RenderProfileJson').then(JSON.parse);
            window.resetRenderProfile = () => dotnetHelper.invokeMethodAsync('ResetRenderProfile');
            window.readBlockCount = () => dotnetHelper.invokeMethodAsync('ImportedBlockCount');
            window.readBlockRectangleCount = () => dotnetHelper.invokeMethodAsync('BlockRectangleCount');
            window.loadBenchmarkGraph = (columns, rows) =>
                dotnetHelper.invokeMethodAsync('LoadBenchmarkGraph', columns, rows);

            setInterval(async () => {
                overlay.textContent = await dotnetHelper.invokeMethodAsync('RenderProfileText');
            }, 250);
        };

        let resizeObserver = null;
        window.initResizeObserver = (dotnetHelper) => {
            const container = document.getElementById('canvasContainer');
            resizeObserver = new ResizeObserver(() => {
                dotnetHelper.invokeMethodAsync('OnBrowserResize');
            });
            resizeObserver.observe(container);
        };
    </script>
</body>

</html>
